[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legal-source-kernel"
version = "0.1.0"
description = "Local, verifiable, auditable legal source kernel for Chilean legal sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=3.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.scripts]
legal-kernel = "legal_source_kernel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_source_kernel"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
